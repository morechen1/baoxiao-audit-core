name: pilot-first-batch-temporary

on:
  workflow_dispatch:
  push:
    branches: [data/pilot-first-batch-v1]
    paths:
      - .github/workflows/pilot-first-batch-temporary.yml

permissions:
  contents: read

jobs:
  collect-parse-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baoxiao_pilot_v1
          POSTGRES_USER: baoxiao
          POSTGRES_PASSWORD: temporary_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baoxiao -d baoxiao_pilot_v1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://baoxiao:temporary_ci_password@localhost:5432/baoxiao_pilot_v1
      DATA_DIR: /tmp/baoxiao-pilot-data
      PACKAGE_ROOT: /tmp/baoxiao-pilot-first-batch-v1-success
      RUN_REPORTS: /tmp/baoxiao-pilot-run-reports
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      LLM_ENABLED: "false"
      EMBEDDING_ENABLED: "false"
      OCR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Verify proxy-free public DNS
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          unset http_proxy https_proxy all_proxy
          mkdir -p "$PACKAGE_ROOT/preflight" "$RUN_REPORTS" "$DATA_DIR"
          uv run python - <<'PY' | tee "$PACKAGE_ROOT/preflight/public-dns.txt"
          import ipaddress
          import json
          import os
          import socket
          from datetime import UTC, datetime
          from pathlib import Path

          hosts = ["www.nfra.gov.cn", "life.cpic.com.cn"]
          proxy_keys = [
              "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY",
              "http_proxy", "https_proxy", "all_proxy",
          ]
          active_proxies = {key: os.environ[key] for key in proxy_keys if os.environ.get(key)}
          if active_proxies:
              raise SystemExit(f"Proxy environment is still active: {sorted(active_proxies)}")

          results = {}
          for host in hosts:
              addresses = {
                  ipaddress.ip_address(item[4][0])
                  for item in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
              }
              print(host, sorted(str(value) for value in addresses))
              if not addresses:
                  raise SystemExit(f"{host}: no DNS result")
              for address in addresses:
                  if (
                      not address.is_global
                      or address.is_private
                      or address.is_loopback
                      or address.is_link_local
                      or address.is_multicast
                      or address.is_reserved
                      or address.is_unspecified
                  ):
                      raise SystemExit(f"{host}: prohibited DNS address {address}")
              results[host] = sorted(str(value) for value in addresses)

          payload = {
              "checked_at": datetime.now(UTC).isoformat(),
              "proxy_environment_active": False,
              "hosts": results,
              "result": "PUBLIC_DNS_PREFLIGHT_OK",
          }
          output = Path(os.environ["PACKAGE_ROOT"]) / "preflight/public-dns.json"
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n")
          print("PUBLIC_DNS_PREFLIGHT_OK")
          PY

      - name: Migrate fresh PostgreSQL and validate manifests
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          unset http_proxy https_proxy all_proxy
          uv run alembic upgrade head
          uv run python -m app.cli.main pilot-validate-manifests \
            --path pilot/manifests | tee "$RUN_REPORTS/manifest-validation.txt"
          grep -Fx "valid=20 failed=0" "$RUN_REPORTS/manifest-validation.txt"

      - name: Collect approved manifests in order
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          unset http_proxy https_proxy all_proxy
          set +e
          : > "$RUN_REPORTS/collection-exit-codes.txt"
          for manifest_name in regulations penalties regulatory_cases product_documents; do
            uv run python -m app.cli.main pilot-collect \
              --manifest "pilot/manifests/${manifest_name}.jsonl" \
              --requested-by github_hosted_runner \
              2>&1 | tee "$RUN_REPORTS/collect-${manifest_name}.txt"
            command_status=${PIPESTATUS[0]}
            echo "${manifest_name}=${command_status}" \
              | tee -a "$RUN_REPORTS/collection-exit-codes.txt"
          done
          exit 0

      - name: Parse pending documents and write reports
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          unset http_proxy https_proxy all_proxy
          uv run python -m app.cli.main parse-pending \
            | tee "$RUN_REPORTS/parse-pending.txt"
          uv run python -m app.cli.main pilot-status \
            | tee "$RUN_REPORTS/pilot-status.txt"
          uv run python -m app.cli.main pilot-quality-report \
            --output "$RUN_REPORTS/pilot-first-batch-quality.json"
          cp pilot/reports/pilot-collection-run-*.jsonl "$RUN_REPORTS/"

      - name: Export database snapshot
        env:
          PGPASSWORD: temporary_ci_password
        run: |
          pg_dump \
            --host localhost \
            --username baoxiao \
            --dbname baoxiao_pilot_v1 \
            --no-owner \
            --no-privileges \
            | gzip -9 > "${RUNNER_TEMP}/pilot-first-batch-v1.sql.gz"

      - name: Build portable material package
        run: |
          uv run python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import shutil
          import unicodedata
          import zipfile
          from collections import Counter
          from datetime import UTC, datetime
          from pathlib import Path

          from sqlalchemy import func, select

          from app.core.database import SessionLocal
          from app.models import (
              AuthenticityDecisionLog,
              DocumentOccurrence,
              ParsedArtifactVersion,
              PilotCollectionItem,
              PilotCollectionRun,
              ReviewDecision,
              SourceDocument,
          )
          from app.models.enums import AuthenticityType, KnowledgeIndexStatus

          root = Path(os.environ["PACKAGE_ROOT"])
          reports = Path(os.environ["RUN_REPORTS"])
          data_dir = Path(os.environ["DATA_DIR"])
          for name in (
              "source-registry",
              "manifests",
              "preflight",
              "reports",
              "mapping",
              "sources",
              "parsed",
          ):
              (root / name).mkdir(parents=True, exist_ok=True)

          for path in Path("pilot/source_registry").glob("*.yaml"):
              shutil.copy2(path, root / "source-registry" / path.name)
          for path in Path("pilot/manifests").glob("*.jsonl"):
              shutil.copy2(path, root / "manifests" / path.name)
          for path in reports.iterdir():
              if path.is_file():
                  shutil.copy2(path, root / "reports" / path.name)

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          def normalize(value: str) -> str:
              return "".join(unicodedata.normalize("NFKC", value).split()).lower()

          error_markers = (
              "请输入验证码",
              "访问被拒绝",
              "access denied",
              "403 forbidden",
              "请求被拦截",
              "系统维护中",
          )
          mapping = []
          anomalies = []
          hash_failures = []
          copied_raw = 0
          copied_parsed = 0
          parsed_items = 0
          requires_ocr_items = 0

          with SessionLocal() as session:
              items = list(
                  session.scalars(select(PilotCollectionItem).order_by(PilotCollectionItem.id))
              )
              runs = list(
                  session.scalars(select(PilotCollectionRun).order_by(PilotCollectionRun.id))
              )
              documents = list(
                  session.scalars(select(SourceDocument).order_by(SourceDocument.id))
              )
              occurrence_count = int(
                  session.scalar(select(func.count()).select_from(DocumentOccurrence)) or 0
              )
              review_count = int(
                  session.scalar(select(func.count()).select_from(ReviewDecision)) or 0
              )
              authenticity_decision_count = int(
                  session.scalar(
                      select(func.count()).select_from(AuthenticityDecisionLog)
                  )
                  or 0
              )

              for item in items:
                  document = session.get(SourceDocument, item.document_id) if item.document_id else None
                  occurrence = (
                      session.get(DocumentOccurrence, item.occurrence_id)
                      if item.occurrence_id
                      else None
                  )
                  raw_relative = None
                  parsed_relative = None
                  raw_hash = None
                  parsed_hash = None
                  parsed_text_hash = None
                  title_match = False
                  content_issues = []

                  if document is not None:
                      raw_source = Path(document.raw_file_path)
                      raw_relative = f"sources/{item.pilot_id}{raw_source.suffix.lower()}"
                      raw_target = root / raw_relative
                      shutil.copy2(raw_source, raw_target)
                      copied_raw += 1
                      raw_hash = digest(raw_target)
                      if raw_hash != document.sha256:
                          hash_failures.append(f"{item.pilot_id}: raw_sha256_mismatch")

                      searchable = "\n".join(
                          value
                          for value in (document.source_title, document.raw_text)
                          if value
                      )
                      title_match = bool(item.expected_title) and normalize(
                          item.expected_title or ""
                      ) in normalize(searchable)
                      if not title_match:
                          content_issues.append("expected_title_not_found")

                      raw_bytes = raw_target.read_bytes()
                      content_type = (document.content_type or "").split(";", 1)[0].lower()
                      if content_type == "application/pdf":
                          if not raw_bytes.startswith(b"%PDF-"):
                              content_issues.append("invalid_pdf_header")
                          if document.parse_status == "requires_ocr":
                              requires_ocr_items += 1
                          elif not (document.raw_text or "").strip():
                              content_issues.append("pdf_text_not_extracted")
                      elif content_type == "text/html":
                          normalized_text = (document.raw_text or "").lower()
                          if len(normalized_text.strip()) < 200:
                              content_issues.append("empty_or_javascript_shell")
                          for marker in error_markers:
                              if marker.lower() in normalized_text:
                                  content_issues.append(f"error_template:{marker}")

                      if document.parse_status == "parsed":
                          parsed_items += 1
                          if not document.parsed_artifact_path:
                              content_issues.append("parsed_artifact_missing")
                          else:
                              parsed_source = Path(document.parsed_artifact_path)
                              parsed_relative = f"parsed/{item.pilot_id}.json"
                              parsed_target = root / parsed_relative
                              shutil.copy2(parsed_source, parsed_target)
                              copied_parsed += 1
                              parsed_hash = digest(parsed_target)
                              parsed_text_hash = document.parsed_text_sha256
                              if parsed_hash != document.parsed_artifact_sha256:
                                  hash_failures.append(
                                      f"{item.pilot_id}: parsed_artifact_sha256_mismatch"
                                  )
                              payload = json.loads(parsed_target.read_text(encoding="utf-8"))
                              actual_text_hash = hashlib.sha256(
                                  payload["plain_text"].encode("utf-8")
                              ).hexdigest()
                              if actual_text_hash != document.parsed_text_sha256:
                                  hash_failures.append(
                                      f"{item.pilot_id}: parsed_text_sha256_mismatch"
                                  )

                      if (
                          document.authenticity_type
                          != AuthenticityType.PENDING_VERIFICATION.value
                      ):
                          content_issues.append("authenticity_not_pending_verification")
                      if (
                          document.knowledge_index_status
                          != KnowledgeIndexStatus.NOT_INDEXED.value
                      ):
                          content_issues.append("unexpected_index_status")

                  if content_issues:
                      anomalies.append(
                          {"pilot_id": item.pilot_id, "issues": sorted(set(content_issues))}
                      )

                  mapping.append(
                      {
                          "pilot_id": item.pilot_id,
                          "source_type": item.source_type,
                          "expected_title": item.expected_title,
                          "source_url": item.source_url,
                          "run_id": item.run_id,
                          "collection_item_id": item.id,
                          "collection_status": item.status,
                          "error_code": item.last_error_code,
                          "document_id": item.document_id,
                          "occurrence_id": item.occurrence_id,
                          "http_status": document.http_status if document else None,
                          "final_url": document.final_url if document else None,
                          "content_type": document.content_type if document else None,
                          "raw_relative_path": raw_relative,
                          "raw_sha256": raw_hash,
                          "parsed_relative_path": parsed_relative,
                          "parsed_artifact_sha256": parsed_hash,
                          "parsed_text_sha256": parsed_text_hash,
                          "parse_status": document.parse_status if document else "not_collected",
                          "authenticity_type": (
                              document.authenticity_type if document else None
                          ),
                          "knowledge_index_status": (
                              document.knowledge_index_status if document else None
                          ),
                          "expected_title_found": title_match,
                          "content_issues": sorted(set(content_issues)),
                          "occurrence_source_url": (
                              occurrence.source_url if occurrence else None
                          ),
                          "occurrence_final_url": (
                              occurrence.final_url if occurrence else None
                          ),
                      }
                  )

              item_statuses = Counter(item.status for item in items)
              error_codes = Counter(
                  item.last_error_code for item in items if item.last_error_code
              )
              summary = {
                  "generated_at": datetime.now(UTC).isoformat(),
                  "planned_count": sum(run.planned_count for run in runs),
                  "run_ids": [run.id for run in runs],
                  "pilot_item_count": len(items),
                  "item_statuses": dict(sorted(item_statuses.items())),
                  "error_codes": dict(sorted(error_codes.items())),
                  "source_document_count": len(documents),
                  "occurrence_count": occurrence_count,
                  "raw_file_count": copied_raw,
                  "parsed_item_count": parsed_items,
                  "requires_ocr_count": requires_ocr_items,
                  "parsed_artifact_file_count": copied_parsed,
                  "content_anomaly_count": len(anomalies),
                  "hash_failure_count": len(hash_failures),
                  "review_decision_count": review_count,
                  "authenticity_decision_count": authenticity_decision_count,
                  "indexed_count": sum(
                      document.knowledge_index_status
                      == KnowledgeIndexStatus.INDEXED.value
                      for document in documents
                  ),
                  "all_documents_pending_verification": all(
                      document.authenticity_type
                      == AuthenticityType.PENDING_VERIFICATION.value
                      for document in documents
                  ),
                  "raw_count_matches_collected_items": copied_raw
                  == item_statuses.get("collected", 0),
                  "parsed_count_matches_artifacts": parsed_items == copied_parsed,
              }

          (root / "mapping/pilot-document-mapping.json").write_text(
              json.dumps(mapping, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (root / "reports/content-validation.json").write_text(
              json.dumps(
                  {
                      "summary": summary,
                      "anomalies": anomalies,
                      "hash_failures": hash_failures,
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          readme = "\n".join(
              [
                  "# 保销智审首批真实公开数据试采集 V1 成功环境材料包",
                  "",
                  "本材料包由 GitHub Hosted Ubuntu Runner 在代理环境变量全部清空、",
                  "公网 DNS 门禁通过、全新 PostgreSQL 16 数据库和空数据目录中生成。",
                  "",
                  f"- 计划条目：{summary['planned_count']}",
                  f"- Pilot Run：{summary['run_ids']}",
                  f"- 条目状态：{summary['item_statuses']}",
                  f"- 固定错误码：{summary['error_codes']}",
                  f"- SourceDocument：{summary['source_document_count']}",
                  f"- Occurrence：{summary['occurrence_count']}",
                  f"- 原件：{summary['raw_file_count']}",
                  f"- 已解析：{summary['parsed_item_count']}",
                  f"- requires_ocr：{summary['requires_ocr_count']}",
                  f"- 解析产物：{summary['parsed_artifact_file_count']}",
                  f"- 内容异常：{summary['content_anomaly_count']}",
                  f"- 哈希异常：{summary['hash_failure_count']}",
                  f"- 人工审核决定：{summary['review_decision_count']}",
                  f"- 真实性决定：{summary['authenticity_decision_count']}",
                  f"- 已索引：{summary['indexed_count']}",
                  "",
                  "所有包内路径均为相对路径。材料包不含数据库密码、代理配置、",
                  "Cookie、认证头、Token、本地绝对路径或 Git 元数据。",
                  "数据库导出作为同一 GitHub Actions artifact 的独立文件提供，",
                  "不放入本 ZIP。",
              ]
          ) + "\n"
          (root / "README.md").write_text(readme, encoding="utf-8")

          zip_path = Path(os.environ["RUNNER_TEMP"]) / (
              "baoxiao-pilot-first-batch-v1-success.zip"
          )
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  relative = path.relative_to(root.parent)
                  if path.is_dir():
                      archive.writestr(f"{relative.as_posix().rstrip('/')}/", b"")
                  else:
                      archive.write(path, relative.as_posix())
          zip_hash = digest(zip_path)
          (Path(os.environ["RUNNER_TEMP"]) / "baoxiao-pilot-first-batch-v1-success.sha256").write_text(
              f"{zip_hash}  {zip_path.name}\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print(f"package_sha256={zip_hash}")
          PY

      - name: Verify package integrity and sensitive-data boundary
        run: |
          uv run python - <<'PY'
          import hashlib
          import re
          import zipfile
          from pathlib import Path, PurePosixPath

          root = Path(__import__("os").environ["RUNNER_TEMP"])
          zip_path = root / "baoxiao-pilot-first-batch-v1-success.zip"
          expected = (
              root / "baoxiao-pilot-first-batch-v1-success.sha256"
          ).read_text().split()[0]
          actual = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit("package_sha256_mismatch")

          secret_pattern = re.compile(
              rb"sk-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{20,}|github_pat_|"
              rb"BEGIN (?:RSA|OPENSSH|EC) PRIVATE KEY|Authorization: Bearer|"
              rb"Cookie:|/home/runner/|/Users/|[A-Za-z]:\\\\Users\\\\"
          )
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"zip_integrity_failure:{bad}")
              for info in archive.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe_archive_path:{info.filename}")
                  if info.is_dir():
                      continue
                  payload = archive.read(info)
                  if secret_pattern.search(payload):
                      raise SystemExit(f"sensitive_content:{info.filename}")
          print(f"ZIP_INTEGRITY_OK sha256={actual}")
          print("RELATIVE_PATHS_OK")
          print("SENSITIVE_DATA_SCAN_OK")
          PY

      - name: Upload pilot material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baoxiao-pilot-first-batch-v1-success
          path: |
            ${{ runner.temp }}/baoxiao-pilot-first-batch-v1-success.zip
            ${{ runner.temp }}/baoxiao-pilot-first-batch-v1-success.sha256
            ${{ runner.temp }}/pilot-first-batch-v1.sql.gz
          if-no-files-found: error
          retention-days: 7
