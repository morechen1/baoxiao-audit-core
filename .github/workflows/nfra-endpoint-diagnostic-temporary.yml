name: nfra-endpoint-diagnostic-temporary

on:
  workflow_dispatch:
  push:
    branches: [data/pilot-first-batch-v1]
    paths:
      - .github/workflows/nfra-endpoint-diagnostic-temporary.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baoxiao_pilot_v1
          POSTGRES_USER: baoxiao
          POSTGRES_PASSWORD: temporary_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baoxiao -d baoxiao_pilot_v1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      DIAGNOSTIC_ROOT: /tmp/nfra-endpoint-diagnostic
      DATABASE_URL: postgresql+psycopg://baoxiao:temporary_ci_password@localhost:5432/baoxiao_pilot_v1
      DATA_DIR: /tmp/baoxiao-pilot-data
      PACKAGE_ROOT: /tmp/baoxiao-pilot-first-batch-v1-success
      RUN_REPORTS: /tmp/baoxiao-pilot-run-reports
      LLM_ENABLED: "false"
      EMBEDDING_ENABLED: "false"
      OCR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install locked Python dependencies
        run: uv sync --frozen --extra dev

      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Verify proxy-free public DNS
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          unset http_proxy https_proxy all_proxy
          mkdir -p "$DIAGNOSTIC_ROOT"
          python - <<'PY' | tee "$DIAGNOSTIC_ROOT/public-dns.txt"
          import ipaddress
          import json
          import os
          import socket
          from datetime import UTC, datetime
          from pathlib import Path

          hosts = ["www.nfra.gov.cn"]
          proxy_keys = [
              "HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY",
              "http_proxy", "https_proxy", "all_proxy",
          ]
          active = {key: os.environ[key] for key in proxy_keys if os.environ.get(key)}
          if active:
              raise SystemExit(f"Proxy environment is still active: {sorted(active)}")

          results = {}
          for host in hosts:
              addresses = {
                  ipaddress.ip_address(item[4][0])
                  for item in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
              }
              print(host, sorted(str(value) for value in addresses))
              if not addresses:
                  raise SystemExit(f"{host}: no DNS result")
              for address in addresses:
                  if (
                      not address.is_global
                      or address.is_private
                      or address.is_loopback
                      or address.is_link_local
                      or address.is_multicast
                      or address.is_reserved
                      or address.is_unspecified
                  ):
                      raise SystemExit(f"{host}: prohibited DNS address {address}")
              results[host] = sorted(str(value) for value in addresses)

          payload = {
              "checked_at": datetime.now(UTC).isoformat(),
              "proxy_environment_active": False,
              "hosts": results,
              "result": "PUBLIC_DNS_PREFLIGHT_OK",
          }
          Path(os.environ["DIAGNOSTIC_ROOT"], "public-dns.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("PUBLIC_DNS_PREFLIGHT_OK")
          PY

      - name: Diagnose three approved NFRA landing pages
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          unset http_proxy https_proxy all_proxy
          node <<'JS'
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");
          const { chromium } = require("playwright");

          const outputRoot = process.env.DIAGNOSTIC_ROOT;
          const selected = new Map([
            ["REG-001", "pilot/manifests/regulations.jsonl"],
            ["PEN-001", "pilot/manifests/penalties.jsonl"],
            ["CASE-002", "pilot/manifests/regulatory_cases.jsonl"],
          ]);

          function approvedTarget(pilotId, filename) {
            const rows = fs.readFileSync(filename, "utf8")
              .split(/\r?\n/)
              .filter(Boolean)
              .map((line) => JSON.parse(line));
            const row = rows.find((item) => item.pilot_id === pilotId);
            if (!row || row.status !== "approved_for_collection") {
              throw new Error(`${pilotId}: approved manifest row not found`);
            }
            const url = new URL(row.source_url);
            if (url.protocol !== "https:" || !isNfraHost(url.hostname)) {
              throw new Error(`${pilotId}: landing URL is not approved NFRA HTTPS`);
            }
            const docId = url.searchParams.get("docId");
            if (!docId || !/^\d+$/.test(docId)) {
              throw new Error(`${pilotId}: invalid docId`);
            }
            return {
              pilot_id: pilotId,
              landing_url: row.source_url,
              expected_title: row.expected_title,
              doc_id: docId,
            };
          }

          function isNfraHost(hostname) {
            const host = hostname.toLowerCase().replace(/\.$/, "");
            return host === "nfra.gov.cn" || host.endsWith(".nfra.gov.cn");
          }

          function sha256(buffer) {
            return crypto.createHash("sha256").update(buffer).digest("hex");
          }

          function normalize(value) {
            return String(value || "").normalize("NFKC").replace(/\s+/g, "").toLowerCase();
          }

          function jsonShape(value, prefix = "", depth = 0, result = []) {
            if (depth > 4 || result.length >= 100) return result;
            if (Array.isArray(value)) {
              result.push(`${prefix || "$"}[]`);
              if (value.length) jsonShape(value[0], `${prefix || "$"}[]`, depth + 1, result);
              return result;
            }
            if (value && typeof value === "object") {
              for (const key of Object.keys(value).sort()) {
                if (result.length >= 100) break;
                const next = prefix ? `${prefix}.${key}` : key;
                result.push(next);
                jsonShape(value[key], next, depth + 1, result);
              }
            }
            return result;
          }

          async function main() {
            const targets = [...selected].map(([id, file]) => approvedTarget(id, file));
            const browser = await chromium.launch({ headless: true });
            const result = {
              generated_at: new Date().toISOString(),
              browser: "playwright-chromium",
              artificial_cookie_set: false,
              tls_verification_disabled: false,
              third_party_requests_recorded: false,
              targets: [],
            };

            for (const target of targets) {
              const context = await browser.newContext();
              await context.clearCookies();
              await context.route("**/*", async (route) => {
                const requestUrl = new URL(route.request().url());
                if (
                  requestUrl.protocol === "data:" ||
                  requestUrl.protocol === "blob:" ||
                  isNfraHost(requestUrl.hostname)
                ) {
                  await route.continue();
                } else {
                  await route.abort("blockedbyclient");
                }
              });

              const page = await context.newPage();
              const responseRecords = [];
              const responseTasks = [];

              page.on("response", (response) => {
                const task = (async () => {
                  const request = response.request();
                  const responseUrl = new URL(response.url());
                  if (!isNfraHost(responseUrl.hostname)) return;

                  const headers = response.headers();
                  const contentType = headers["content-type"] || "";
                  const contentLengthHeader = headers["content-length"];
                  let body = Buffer.alloc(0);
                  let bodyError = null;
                  try {
                    body = await response.body();
                  } catch (error) {
                    bodyError = error.constructor?.name || "response_body_unavailable";
                  }

                  const utf8 = (
                    /json|javascript|text|html|xml/i.test(contentType) &&
                    body.length <= 10 * 1024 * 1024
                  ) ? body.toString("utf8") : "";
                  const normalizedBody = normalize(utf8);
                  const postData = request.postData() || "";
                  const containsDocId = (
                    response.url().includes(target.doc_id) ||
                    postData.includes(target.doc_id) ||
                    utf8.includes(target.doc_id)
                  );
                  const containsExpectedTitle = (
                    normalizedBody.includes(normalize(target.expected_title))
                  );
                  const containsDocumentBody = (
                    containsExpectedTitle &&
                    (
                      /docClob|docTitle|publishDate|docSource|documentNo/.test(utf8) ||
                      normalize(utf8).length >= 500
                    )
                  );
                  let parsedJsonShape = [];
                  if (/json/i.test(contentType) || /^[\s]*[\[{]/.test(utf8)) {
                    try {
                      parsedJsonShape = jsonShape(JSON.parse(utf8));
                    } catch {}
                  }

                  responseRecords.push({
                    landing_url: target.landing_url,
                    request_url: response.url(),
                    method: request.method(),
                    status: response.status(),
                    resource_type: request.resourceType(),
                    content_type: contentType,
                    content_length: contentLengthHeader
                      ? Number(contentLengthHeader)
                      : body.length,
                    response_sha256: body.length ? sha256(body) : null,
                    contains_doc_id: containsDocId,
                    contains_expected_title: containsExpectedTitle,
                    contains_document_body: containsDocumentBody,
                    request_has_post_data: Boolean(postData),
                    request_has_cookie: Boolean(request.headers()["cookie"]),
                    response_body_error: bodyError,
                    json_shape: parsedJsonShape,
                  });
                })();
                responseTasks.push(task);
              });

              let navigationError = null;
              try {
                await page.goto(target.landing_url, {
                  waitUntil: "domcontentloaded",
                  timeout: 45000,
                });
                try {
                  await page.waitForLoadState("networkidle", { timeout: 20000 });
                } catch {}
                await page.waitForTimeout(3000);
              } catch (error) {
                navigationError = error.constructor?.name || "navigation_failed";
              }
              await Promise.allSettled(responseTasks);

              const rendered = await page.evaluate(({ expectedTitle }) => {
                const bodyText = document.body?.innerText || "";
                const titleNode = document.querySelector(".wenzhang-title");
                const bodyNode = document.querySelector("#wenzhang-content");
                const titleText = titleNode?.textContent || "";
                const bodyContent = bodyNode?.textContent || "";
                const normalizeText = (value) => String(value || "")
                  .normalize("NFKC")
                  .replace(/\s+/g, "")
                  .toLowerCase();
                return {
                  final_url: location.href,
                  document_title: document.title,
                  rendered_title_present: Boolean(titleNode),
                  rendered_body_present: Boolean(bodyNode),
                  rendered_title_matches: normalizeText(titleText)
                    .includes(normalizeText(expectedTitle)),
                  rendered_body_length: bodyContent.trim().length,
                  angular_template_shell: (
                    /\{\{[^}]+\}\}/.test(bodyText) ||
                    normalizeText(bodyText).includes("{{data.")
                  ),
                };
              }, { expectedTitle: target.expected_title });

              result.targets.push({
                ...target,
                navigation_error: navigationError,
                rendered,
                official_response_count: responseRecords.length,
                responses: responseRecords.sort((a, b) =>
                  a.request_url.localeCompare(b.request_url)
                ),
              });
              await context.close();
            }

            await browser.close();
            fs.writeFileSync(
              path.join(outputRoot, "network-diagnostic.json"),
              JSON.stringify(result, null, 2) + "\n",
            );
            console.log(JSON.stringify(result, null, 2));
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          JS

      - name: Gate collection on repeatable official API responses
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          unset http_proxy https_proxy all_proxy
          node <<'JS'
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");

          const root = process.env.DIAGNOSTIC_ROOT;
          const diagnostic = JSON.parse(
            fs.readFileSync(path.join(root, "network-diagnostic.json"), "utf8"),
          );
          const normalize = (value) =>
            String(value || "").normalize("NFKC").replace(/\s+/g, "").toLowerCase();
          const sha256 = (value) =>
            crypto.createHash("sha256").update(value).digest("hex");

          async function fetchOnce(url) {
            const response = await fetch(url, {
              method: "GET",
              redirect: "manual",
              headers: { "User-Agent": "baoxiao-audit-core/0.1" },
            });
            const body = Buffer.from(await response.arrayBuffer());
            const contentType = response.headers.get("content-type") || "";
            if (response.status !== 200 || !/application\/json/i.test(contentType)) {
              throw new Error(`official_api_invalid_response:${response.status}:${contentType}`);
            }
            return {
              status: response.status,
              content_type: contentType,
              content_length: body.length,
              sha256: sha256(body),
              json: JSON.parse(body.toString("utf8")),
            };
          }

          async function main() {
            const records = [];
            for (const target of diagnostic.targets) {
              const candidate = target.responses.find((response) =>
                response.request_url.includes("/cn/static/data/DocInfo/SelectByDocId/"),
              );
              if (!candidate) throw new Error(`${target.pilot_id}:official_api_not_found`);
              const url = new URL(candidate.request_url);
              if (
                url.protocol !== "https:" ||
                url.hostname !== "www.nfra.gov.cn" ||
                url.pathname !==
                  `/cn/static/data/DocInfo/SelectByDocId/data_docId=${target.doc_id}.json`
              ) {
                throw new Error(`${target.pilot_id}:official_api_not_canonical`);
              }
              const first = await fetchOnce(url.href);
              const second = await fetchOnce(url.href);
              const data = first.json?.data;
              if (
                first.sha256 !== second.sha256 ||
                String(data?.docId) !== target.doc_id ||
                !normalize(data?.docTitle).includes(normalize(target.expected_title)) ||
                normalize(data?.docClob).length < 200
              ) {
                throw new Error(`${target.pilot_id}:official_api_not_stable`);
              }
              records.push({
                pilot_id: target.pilot_id,
                landing_url: target.landing_url,
                retrieval_url: url.href,
                doc_id: target.doc_id,
                first_status: first.status,
                second_status: second.status,
                content_type: first.content_type,
                content_length: first.content_length,
                first_sha256: first.sha256,
                second_sha256: second.sha256,
                hashes_match: true,
                doc_id_matches: true,
                title_matches: true,
                body_present: true,
                request_cookie_set: false,
              });
            }
            fs.writeFileSync(
              path.join(root, "official-api-repeatability.json"),
              JSON.stringify({ result: "OFFICIAL_API_REPEATABILITY_OK", records }, null, 2) + "\n",
            );
            console.log("OFFICIAL_API_REPEATABILITY_OK");
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          JS

      - name: Diagnose approved NFRA response fields without storing bodies
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          unset http_proxy https_proxy all_proxy
          node <<'JS'
          const fs = require("fs");
          const path = require("path");

          const manifests = [
            "pilot/manifests/regulations.jsonl",
            "pilot/manifests/penalties.jsonl",
            "pilot/manifests/regulatory_cases.jsonl",
          ];
          const normalize = (value) =>
            String(value || "").normalize("NFKC").replace(/\s+/g, "").toLowerCase();
          const textLength = (html) =>
            String(html || "")
              .replace(/<script[\s\S]*?<\/script>/gi, "")
              .replace(/<style[\s\S]*?<\/style>/gi, "")
              .replace(/<[^>]+>/g, " ")
              .replace(/&nbsp;|&#160;/gi, " ")
              .replace(/\s+/g, " ")
              .trim().length;

          async function main() {
            const rows = manifests.flatMap((filename) =>
              fs.readFileSync(filename, "utf8")
                .split(/\r?\n/)
                .filter(Boolean)
                .map((line) => JSON.parse(line)),
            );
            const records = [];
            for (const row of rows) {
              const landing = new URL(row.source_url);
              const docId = landing.searchParams.get("docId");
              if (!docId || !/^\d+$/.test(docId)) {
                throw new Error(`${row.pilot_id}:invalid_doc_id`);
              }
              const retrievalUrl =
                "https://www.nfra.gov.cn/cn/static/data/DocInfo/SelectByDocId/" +
                `data_docId=${docId}.json`;
              const response = await fetch(retrievalUrl, {
                method: "GET",
                redirect: "manual",
                headers: { "User-Agent": "baoxiao-audit-core/0.1" },
              });
              const payload = await response.json();
              const data = payload?.data || {};
              const expected = normalize(row.expected_title);
              const matchingFields = Object.entries(data)
                .filter(([, value]) => typeof value === "string")
                .filter(([, value]) => normalize(value).includes(expected))
                .map(([key]) => key)
                .sort();
              const attachments = Array.isArray(data.attachmentInfoVOList)
                ? data.attachmentInfoVOList.map((item) => ({
                    keys: Object.keys(item || {}).sort(),
                    file_name: item?.fileName || item?.attachName || item?.name || null,
                    file_url:
                      item?.fileUrl || item?.attachUrl || item?.url || item?.filePath || null,
                  }))
                : [];
              records.push({
                pilot_id: row.pilot_id,
                expected_title: row.expected_title,
                doc_id: docId,
                retrieval_url: retrievalUrl,
                status: response.status,
                content_type: response.headers.get("content-type"),
                rpt_code: payload?.rptCode ?? null,
                doc_title: data.docTitle ?? null,
                doc_source: data.docSource ?? null,
                publish_date: data.publishDate ?? null,
                document_number: data.documentNo ?? null,
                doc_clob_length: String(data.docClob || "").length,
                doc_clob_text_length: textLength(data.docClob),
                remark2_length: String(data.remark2 || "").length,
                doc_file_url: data.docFileUrl || null,
                pdf_file_url: data.pdfFileUrl || null,
                matching_string_fields: matchingFields,
                attachment_count: attachments.length,
                attachments,
                request_cookie_set: false,
              });
            }
            fs.writeFileSync(
              path.join(
                process.env.DIAGNOSTIC_ROOT,
                "nfra-all-manifest-diagnostic.json",
              ),
              JSON.stringify({ records }, null, 2) + "\n",
            );
            console.log(`NFRA_MANIFEST_DIAGNOSTIC_OK count=${records.length}`);
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          JS

      - name: Migrate fresh PostgreSQL and validate all manifests
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          unset http_proxy https_proxy all_proxy
          mkdir -p "$DATA_DIR" "$RUN_REPORTS" "$PACKAGE_ROOT/preflight"
          cp "$DIAGNOSTIC_ROOT/public-dns.json" "$PACKAGE_ROOT/preflight/"
          cp "$DIAGNOSTIC_ROOT/public-dns.txt" "$PACKAGE_ROOT/preflight/"
          cp "$DIAGNOSTIC_ROOT/network-diagnostic.json" "$PACKAGE_ROOT/preflight/"
          cp "$DIAGNOSTIC_ROOT/official-api-repeatability.json" "$PACKAGE_ROOT/preflight/"
          cp "$DIAGNOSTIC_ROOT/nfra-all-manifest-diagnostic.json" "$PACKAGE_ROOT/preflight/"
          uv run alembic upgrade head
          uv run python -m app.cli.main pilot-validate-manifests \
            --path pilot/manifests | tee "$RUN_REPORTS/manifest-validation.txt"
          grep -Fx "valid=20 failed=0" "$RUN_REPORTS/manifest-validation.txt"

      - name: Collect four approved manifest groups
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          unset http_proxy https_proxy all_proxy
          set +e
          : > "$RUN_REPORTS/collection-exit-codes.txt"
          for manifest_name in regulations penalties regulatory_cases; do
            uv run python -m app.cli.main pilot-collect \
              --manifest "pilot/manifests/${manifest_name}.jsonl" \
              --requested-by github_hosted_runner \
              2>&1 | tee "$RUN_REPORTS/collect-${manifest_name}.txt"
            command_status=${PIPESTATUS[0]}
            echo "${manifest_name}=${command_status}" \
              | tee -a "$RUN_REPORTS/collection-exit-codes.txt"
          done
          exit 0

      - name: Parse pending documents and export run reports
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          unset http_proxy https_proxy all_proxy
          uv run python -m app.cli.main parse-pending \
            | tee "$RUN_REPORTS/parse-pending.txt"
          uv run python -m app.cli.main pilot-status \
            | tee "$RUN_REPORTS/pilot-status.txt"
          uv run python -m app.cli.main pilot-quality-report \
            --output "$RUN_REPORTS/pilot-first-batch-quality.json"
          cp pilot/reports/pilot-collection-run-*.jsonl "$RUN_REPORTS/"

      - name: Export fresh database snapshot
        env:
          PGPASSWORD: temporary_ci_password
        run: |
          pg_dump \
            --host localhost \
            --username baoxiao \
            --dbname baoxiao_pilot_v1 \
            --no-owner \
            --no-privileges \
            | gzip -9 > "${RUNNER_TEMP}/pilot-first-batch-v1.sql.gz"

      - name: Build portable pilot material package
        run: |
          uv run python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import shutil
          import unicodedata
          import zipfile
          from collections import Counter
          from datetime import UTC, datetime
          from pathlib import Path

          from sqlalchemy import func, select

          from app.core.database import SessionLocal
          from app.models import (
              AuthenticityDecisionLog,
              DocumentOccurrence,
              PilotCollectionItem,
              PilotCollectionRun,
              ReviewDecision,
              SourceDocument,
          )
          from app.models.enums import AuthenticityType, KnowledgeIndexStatus

          root = Path(os.environ["PACKAGE_ROOT"])
          reports = Path(os.environ["RUN_REPORTS"])
          for name in (
              "source-registry",
              "manifests",
              "preflight",
              "reports",
              "mapping",
              "sources",
              "parsed",
          ):
              (root / name).mkdir(parents=True, exist_ok=True)
          for path in Path("pilot/source_registry").glob("*.yaml"):
              shutil.copy2(path, root / "source-registry" / path.name)
          for path in Path("pilot/manifests").glob("*.jsonl"):
              shutil.copy2(path, root / "manifests" / path.name)
          for path in reports.iterdir():
              if path.is_file():
                  shutil.copy2(path, root / "reports" / path.name)

          def digest(path: Path) -> str:
              value = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      value.update(chunk)
              return value.hexdigest()

          def normalize(value: str) -> str:
              return "".join(unicodedata.normalize("NFKC", value).split()).lower()

          mapping = []
          hash_failures = []
          title_failures = []
          raw_count = 0
          parsed_count = 0
          requires_ocr_count = 0

          with SessionLocal() as session:
              items = list(
                  session.scalars(select(PilotCollectionItem).order_by(PilotCollectionItem.id))
              )
              runs = list(
                  session.scalars(select(PilotCollectionRun).order_by(PilotCollectionRun.id))
              )
              documents = list(
                  session.scalars(select(SourceDocument).order_by(SourceDocument.id))
              )
              review_count = int(
                  session.scalar(select(func.count()).select_from(ReviewDecision)) or 0
              )
              authenticity_decision_count = int(
                  session.scalar(
                      select(func.count()).select_from(AuthenticityDecisionLog)
                  )
                  or 0
              )
              occurrence_count = int(
                  session.scalar(select(func.count()).select_from(DocumentOccurrence)) or 0
              )

              for item in items:
                  document = session.get(SourceDocument, item.document_id) if item.document_id else None
                  occurrence = (
                      session.get(DocumentOccurrence, item.occurrence_id)
                      if item.occurrence_id
                      else None
                  )
                  raw_relative = None
                  parsed_relative = None
                  raw_sha256 = None
                  parsed_sha256 = None
                  title_found = False

                  if document:
                      raw_source = Path(document.raw_file_path)
                      raw_relative = f"sources/{item.pilot_id}{raw_source.suffix.lower()}"
                      raw_target = root / raw_relative
                      shutil.copy2(raw_source, raw_target)
                      raw_count += 1
                      raw_sha256 = digest(raw_target)
                      if raw_sha256 != document.sha256:
                          hash_failures.append(f"{item.pilot_id}:raw_sha256_mismatch")

                      searchable = "\n".join(
                          value for value in (document.source_title, document.raw_text) if value
                      )
                      title_found = bool(item.expected_title) and normalize(
                          item.expected_title or ""
                      ) in normalize(searchable)
                      if not title_found:
                          title_failures.append(item.pilot_id)

                      if document.parse_status == "requires_ocr":
                          requires_ocr_count += 1
                      elif document.parse_status == "parsed" and document.parsed_artifact_path:
                          parsed_relative = f"parsed/{item.pilot_id}.json"
                          parsed_target = root / parsed_relative
                          shutil.copy2(Path(document.parsed_artifact_path), parsed_target)
                          parsed_count += 1
                          parsed_sha256 = digest(parsed_target)
                          if parsed_sha256 != document.parsed_artifact_sha256:
                              hash_failures.append(
                                  f"{item.pilot_id}:parsed_artifact_sha256_mismatch"
                              )
                          payload = json.loads(parsed_target.read_text(encoding="utf-8"))
                          text_sha256 = hashlib.sha256(
                              payload["plain_text"].encode("utf-8")
                          ).hexdigest()
                          if text_sha256 != document.parsed_text_sha256:
                              hash_failures.append(
                                  f"{item.pilot_id}:parsed_text_sha256_mismatch"
                              )

                  mapping.append(
                      {
                          "pilot_id": item.pilot_id,
                          "source_type": item.source_type,
                          "expected_title": item.expected_title,
                          "source_url": item.source_url,
                          "collection_status": item.status,
                          "error_code": item.last_error_code,
                          "document_id": item.document_id,
                          "occurrence_id": item.occurrence_id,
                          "http_status": document.http_status if document else None,
                          "final_url": document.final_url if document else None,
                          "content_type": document.content_type if document else None,
                          "raw_relative_path": raw_relative,
                          "raw_sha256": raw_sha256,
                          "parsed_relative_path": parsed_relative,
                          "parsed_artifact_sha256": parsed_sha256,
                          "parse_status": document.parse_status if document else "not_collected",
                          "authenticity_type": (
                              document.authenticity_type if document else None
                          ),
                          "knowledge_index_status": (
                              document.knowledge_index_status if document else None
                          ),
                          "expected_title_found": title_found,
                          "occurrence_source_url": occurrence.source_url if occurrence else None,
                          "occurrence_final_url": occurrence.final_url if occurrence else None,
                      }
                  )

              statuses = Counter(item.status for item in items)
              errors = Counter(item.last_error_code for item in items if item.last_error_code)
              summary = {
                  "generated_at": datetime.now(UTC).isoformat(),
                  "run_ids": [run.id for run in runs],
                  "planned_count": sum(run.planned_count for run in runs),
                  "pilot_item_count": len(items),
                  "item_statuses": dict(sorted(statuses.items())),
                  "error_codes": dict(sorted(errors.items())),
                  "source_document_count": len(documents),
                  "occurrence_count": occurrence_count,
                  "raw_file_count": raw_count,
                  "parsed_artifact_file_count": parsed_count,
                  "requires_ocr_count": requires_ocr_count,
                  "hash_failures": hash_failures,
                  "title_failures": title_failures,
                  "review_decision_count": review_count,
                  "authenticity_decision_count": authenticity_decision_count,
                  "indexed_count": sum(
                      document.knowledge_index_status
                      == KnowledgeIndexStatus.INDEXED.value
                      for document in documents
                  ),
                  "all_documents_pending_verification": all(
                      document.authenticity_type
                      == AuthenticityType.PENDING_VERIFICATION.value
                      for document in documents
                  ),
                  "raw_count_matches_collected_items": (
                      raw_count == statuses.get("collected", 0)
                  ),
                  "parsed_count_matches_source_documents": (
                      parsed_count + requires_ocr_count == len(documents)
                  ),
              }

          (root / "mapping/pilot-document-mapping.json").write_text(
              json.dumps(mapping, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (root / "reports/summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (root / "README.md").write_text(
              "\n".join(
                  [
                      "# 保销智审首批真实公开数据试采集 V1 材料包",
                      "",
                      "由 GitHub Hosted Ubuntu Runner 在无代理环境变量、真实公网 DNS、",
                      "全新 PostgreSQL 16 数据库和空数据目录中生成。",
                      "",
                      f"- 计划条目：{summary['planned_count']}",
                      f"- 条目状态：{summary['item_statuses']}",
                      f"- 固定错误码：{summary['error_codes']}",
                      f"- 原件：{summary['raw_file_count']}",
                      f"- 解析产物：{summary['parsed_artifact_file_count']}",
                      f"- requires_ocr：{summary['requires_ocr_count']}",
                      "",
                      "本 Runner 制品只包含本轮重新执行的 18 份 NFRA 官方公开 JSON。",
                      "最终材料包另行保留上一轮已成功并核验的两份 CPIC 官方 PDF。",
                      "所有文档保持 pending_verification，未执行结构化导入、人工审核、",
                      "真实性升级或索引。数据库导出作为 Actions artifact 独立文件提供。",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          zip_path = Path(os.environ["RUNNER_TEMP"]) / (
              "baoxiao-pilot-first-batch-v1-success.zip"
          )
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob("*")):
                  relative = path.relative_to(root.parent).as_posix()
                  if path.is_dir():
                      archive.writestr(f"{relative.rstrip('/')}/", b"")
                  else:
                      archive.write(path, relative)
          zip_sha256 = digest(zip_path)
          (
              Path(os.environ["RUNNER_TEMP"])
              / "baoxiao-pilot-first-batch-v1-success.sha256"
          ).write_text(
              f"{zip_sha256}  {zip_path.name}\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          print(f"package_sha256={zip_sha256}")
          PY

      - name: Verify material package trust boundary
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import zipfile
          from pathlib import Path, PurePosixPath

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          zip_path = runner_temp / "baoxiao-pilot-first-batch-v1-success.zip"
          expected = (
              runner_temp / "baoxiao-pilot-first-batch-v1-success.sha256"
          ).read_text().split()[0]
          actual = hashlib.sha256(zip_path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit("package_sha256_mismatch")

          secret_pattern = re.compile(
              rb"sk-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{20,}|github_pat_|"
              rb"BEGIN (?:RSA|OPENSSH|EC) PRIVATE KEY|Authorization: Bearer|"
              rb"Cookie:|/home/runner/|/Users/|[A-Za-z]:\\\\Users\\\\"
          )
          with zipfile.ZipFile(zip_path) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f"zip_integrity_failure:{bad}")
              for info in archive.infolist():
                  member = PurePosixPath(info.filename)
                  if member.is_absolute() or ".." in member.parts:
                      raise SystemExit(f"unsafe_archive_path:{info.filename}")
                  if not info.is_dir() and secret_pattern.search(archive.read(info)):
                      raise SystemExit(f"sensitive_content:{info.filename}")
              summary = json.loads(
                  archive.read(
                      "baoxiao-pilot-first-batch-v1-success/reports/summary.json"
                  )
              )

          required = {
              "planned_count": 18,
              "pilot_item_count": 18,
              "source_document_count": 18,
              "raw_file_count": 18,
              "occurrence_count": 18,
              "review_decision_count": 0,
              "authenticity_decision_count": 0,
              "indexed_count": 0,
              "all_documents_pending_verification": True,
              "raw_count_matches_collected_items": True,
              "parsed_count_matches_source_documents": True,
          }
          failures = {
              key: {"expected": expected_value, "actual": summary.get(key)}
              for key, expected_value in required.items()
              if summary.get(key) != expected_value
          }
          if summary.get("item_statuses") != {"collected": 18}:
              failures["item_statuses"] = summary.get("item_statuses")
          if summary.get("hash_failures"):
              failures["hash_failures"] = summary["hash_failures"]
          if summary.get("title_failures"):
              failures["title_failures"] = summary["title_failures"]
          if failures:
              raise SystemExit(f"material_quality_gate_failed:{failures}")
          print(f"ZIP_INTEGRITY_OK sha256={actual}")
          print("RELATIVE_PATHS_OK")
          print("HASH_AND_COUNT_CONSISTENCY_OK")
          print("SENSITIVE_DATA_SCAN_OK")
          PY

      - name: Validate diagnostic privacy boundary
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          root = Path(os.environ["DIAGNOSTIC_ROOT"])
          report = json.loads((root / "network-diagnostic.json").read_text())
          if len(report["targets"]) != 3:
              raise SystemExit("unexpected_target_count")

          for target in report["targets"]:
              for response in target["responses"]:
                  host = (urlsplit(response["request_url"]).hostname or "").lower()
                  if host != "nfra.gov.cn" and not host.endswith(".nfra.gov.cn"):
                      raise SystemExit("third_party_response_recorded")
                  forbidden = {
                      "cookie", "authorization", "request_headers", "response_headers"
                  }
                  if forbidden.intersection(response):
                      raise SystemExit("forbidden_header_material_recorded")

          payload = (root / "network-diagnostic.json").read_bytes()
          sensitive = re.compile(
              rb"ghp_[A-Za-z0-9]{20,}|github_pat_|Authorization:|Cookie:|"
              rb"/home/runner/|/Users/|[A-Za-z]:\\\\Users\\\\"
          )
          if sensitive.search(payload):
              raise SystemExit("sensitive_diagnostic_content")
          print("DIAGNOSTIC_PRIVACY_BOUNDARY_OK")
          PY

      - name: Verify official API repeatability without browser state
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY
          unset http_proxy https_proxy all_proxy
          node <<'JS'
          const crypto = require("crypto");
          const fs = require("fs");
          const path = require("path");

          const root = process.env.DIAGNOSTIC_ROOT;
          const diagnostic = JSON.parse(
            fs.readFileSync(path.join(root, "network-diagnostic.json"), "utf8"),
          );

          function sha256(buffer) {
            return crypto.createHash("sha256").update(buffer).digest("hex");
          }

          function normalize(value) {
            return String(value || "").normalize("NFKC").replace(/\s+/g, "").toLowerCase();
          }

          async function fetchOnce(url) {
            const response = await fetch(url, {
              method: "GET",
              redirect: "manual",
              headers: { "User-Agent": "baoxiao-audit-core/0.1" },
            });
            const body = Buffer.from(await response.arrayBuffer());
            const contentType = response.headers.get("content-type") || "";
            if (response.status !== 200 || !/application\/json/i.test(contentType)) {
              throw new Error(`official_api_invalid_response:${response.status}:${contentType}`);
            }
            return {
              status: response.status,
              content_type: contentType,
              content_length: body.length,
              sha256: sha256(body),
              json: JSON.parse(body.toString("utf8")),
            };
          }

          async function main() {
            const records = [];
            for (const target of diagnostic.targets) {
              const candidate = target.responses.find((response) =>
                response.request_url.includes("/cn/static/data/DocInfo/SelectByDocId/"),
              );
              if (!candidate) throw new Error(`${target.pilot_id}:official_api_not_found`);
              const url = new URL(candidate.request_url);
              if (
                url.protocol !== "https:" ||
                url.hostname !== "www.nfra.gov.cn" ||
                url.pathname !==
                  `/cn/static/data/DocInfo/SelectByDocId/data_docId=${target.doc_id}.json`
              ) {
                throw new Error(`${target.pilot_id}:official_api_not_canonical`);
              }

              const first = await fetchOnce(url.href);
              const second = await fetchOnce(url.href);
              const data = first.json?.data;
              if (
                first.sha256 !== second.sha256 ||
                String(data?.docId) !== target.doc_id ||
                !normalize(data?.docTitle).includes(normalize(target.expected_title)) ||
                normalize(data?.docClob).length < 200
              ) {
                throw new Error(`${target.pilot_id}:official_api_not_stable`);
              }
              records.push({
                pilot_id: target.pilot_id,
                landing_url: target.landing_url,
                retrieval_url: url.href,
                doc_id: target.doc_id,
                first_status: first.status,
                second_status: second.status,
                content_type: first.content_type,
                content_length: first.content_length,
                first_sha256: first.sha256,
                second_sha256: second.sha256,
                hashes_match: true,
                doc_id_matches: true,
                title_matches: true,
                body_present: true,
                request_cookie_set: false,
              });
            }
            fs.writeFileSync(
              path.join(root, "official-api-repeatability.json"),
              JSON.stringify({ result: "OFFICIAL_API_REPEATABILITY_OK", records }, null, 2) + "\n",
            );
            console.log("OFFICIAL_API_REPEATABILITY_OK");
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          JS

