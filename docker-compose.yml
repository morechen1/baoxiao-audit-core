services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: baoxiao
      POSTGRES_USER: baoxiao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baoxiao_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baoxiao -d baoxiao"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql+psycopg://baoxiao:${POSTGRES_PASSWORD:-baoxiao_local_only}@postgres:5432/baoxiao
      LLM_ENABLED: "false"
      EMBEDDING_ENABLED: "false"
      OCR_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
